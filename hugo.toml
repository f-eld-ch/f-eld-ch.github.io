title = "F-ELD"
theme = "sitrep"
baseURL = "https://f-eld.ch/"
relativeURLs = true
defaultContentLanguage = "de"
publishDir = "public"
copyright = "Verein F-ELD"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

defaultContentLanguageInSubdir = false

[languages]
  [languages.de]
    locale = "de-CH"
    label = "Deutsch"
    weight = 1

[[menus.main]]
  name = "Der Verein"
  pageRef = "/verein"
  weight = 10
[[menus.main]]
  name = "Gönnermitglied werden"
  pageRef = "/goenner"
  weight = 20
[[menus.main]]
  name = "sitrep"
  url = "https://sitrep.ch"
  weight = 30

[params]
  description = "Verein Förderung der elektronischen Lagedarstellung"
  repo = "https://github.com/f-eld-ch"
  email = "info@sitrep.ch"
  sitrep = "https://sitrep.ch"
  defaultlang = "de"

[markup.goldmark.renderer]
  unsafe = false
[markup.highlight]
  noClasses = false

# No RSS: the site has no blog.
[outputs]
  home = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]
