<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }}">
      <img class="logo-light" src="{{ "brand/lockup-on-paper.svg" | relURL }}" alt="{{ site.Title }}" width="103" height="32" style="aspect-ratio: 308 / 96">
      <img class="logo-dark" src="{{ "brand/lockup-on-ink.svg" | relURL }}" alt="" width="103" height="32" style="aspect-ratio: 308 / 96" aria-hidden="true">
    </a>
    <nav id="main-nav" aria-label="Main">
      <ul>
        {{ $cur := . }}
        {{ range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if or ($cur.IsMenuCurrent "main" .) ($cur.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
    {{ partial "lang-switch.html" . }}
    <button type="button" class="menu-button" aria-expanded="false" aria-controls="main-nav" data-menu-toggle><span aria-hidden="true">☰</span> {{ i18n "menu" }}</button>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="{{ i18n "toggle_theme" }}">◐</button>
  </div>
</header>
